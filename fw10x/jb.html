<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATARI SHERWAN | GoldHEN 10.x</title>
<style>html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
#wrap{padding:18px}
#brand{color:#ffd21a;font-size:16px;font-weight:800;margin-bottom:12px}
#state{color:#ffd21a;font-size:22px;font-weight:800;margin-bottom:12px}
#console{white-space:pre-wrap;font:12px/1.45 monospace;color:#ddd;max-height:78vh;overflow:auto}
.ok{color:#7fd0a0}.bad{color:#ff7777}</style>
</head>
<body>
<div id="wrap">
  <div id="brand">ATARI SHERWAN</div>
  <div id="state">DETECTING FIRMWARE...</div>
  <pre id="console"></pre>
</div>
<script>
(function(){

  var allowed=false;
  try{
    var until=parseInt(localStorage.getItem('atari_launch_until')||'0',10);
    localStorage.removeItem('atari_launch_until');
    allowed=(until>0 && Date.now()<=until);
  }catch(e){}
  if(!allowed){
    location.replace('../');
    return;
  }

function bootGoldHEN(){

window.jailbreakSuccess=function(){
  document.getElementById('state').textContent='GOLDHEN LOADED';
  document.getElementById('state').className='ok';
};
sessionStorage.setItem('payload_path','goldhen.bin');
localStorage.setItem('exploitChain','4');
function getFW(){
  var m=/PlayStation\s+4[\/\s]+(\d+)\.(\d+)/i.exec(navigator.userAgent||'');
  if(!m)return null;
  var minor=String(m[2]);
  if(minor.length===1)minor='0'+minor;
  if(minor.length>2)minor=minor.slice(0,2);
  return m[1]+'.'+minor;
}
var fw=getFW(),ok=['10.00','10.01','10.50','10.70','10.71'];
var st=document.getElementById('state');
if(!fw){st.textContent='PS4 NOT DETECTED';st.className='bad';return;}
if(ok.indexOf(fw)<0){st.textContent='UNSUPPORTED FW '+fw;st.className='bad';return;}
st.textContent='LOADING GOLDHEN '+fw+'...';
var s=document.createElement('script');
s.src='src/cssfontface/main.js';
s.onload=function(){doCssFontFaceJailbreak();};
s.onerror=function(){st.textContent='FAILED TO LOAD CSSFONTFACE';st.className='bad';};
document.body.appendChild(s);

}

  var started=false;
  function startOnce(){
    if(started)return;
    started=true;
    bootGoldHEN();
  }

  function cacheError(){
    var st=document.getElementById('state');
    st.textContent='OFFLINE CACHE FAILED - RELOAD ONLINE';
    st.className='bad';
  }

  var ac=window.applicationCache;
  if(!ac){
    startOnce();
  }else{
    try{
      if(ac.status===ac.IDLE){
        startOnce();
      }else if(ac.status===ac.UPDATEREADY){
        try{ac.swapCache();}catch(e){}
        startOnce();
      }else if(ac.status===ac.CHECKING || ac.status===ac.DOWNLOADING){
        document.getElementById('state').textContent='PREPARING OFFLINE CACHE...';
        ac.addEventListener('cached',startOnce,false);
        ac.addEventListener('noupdate',startOnce,false);
        ac.addEventListener('updateready',function(){
          try{ac.swapCache();}catch(e){}
          startOnce();
        },false);
        ac.addEventListener('error',cacheError,false);
      }else{
        cacheError();
      }
    }catch(e){
      startOnce();
    }
  }

})();
</script>
</body>
</html>
