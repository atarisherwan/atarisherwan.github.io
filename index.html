<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATARI SHERWAN | GoldHEN</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#start{
    padding:20px 45px;
    border:2px solid #ffd21a;
    border-radius:16px;
    background:#111;
    color:#fff;
    font-size:24px;
    font-weight:bold;
}

#msg{
    position:absolute;
    bottom:30px;
    color:#ffd21a;
}
</style>
</head>

<body>

<button id="start">START GOLDHEN</button>
<div id="msg"></div>

<script>
(function(){

var btn=document.getElementById("start");
var msg=document.getElementById("msg");

function firmware(){
    var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);

    if(!m) return null;

    var minor=m[2];

    if(minor.length===1){
        minor="0"+minor;
    }

    return m[1]+"."+minor;
}

btn.onclick=function(){

    var fw=firmware();

    var supported=[
        "13.00",
        "13.02",
        "13.04",
        "13.50",
        "13.52"
    ];

    if(!fw){
        msg.textContent="PS4 NOT DETECTED";
        return;
    }

    if(supported.indexOf(fw)===-1){
        msg.textContent="UNSUPPORTED FW "+fw;
        return;
    }

    btn.disabled=true;
    btn.textContent="LOADING GOLDHEN...";

    location.href="fw13x/jb.html";
};

})();
</script>

</body>
</html>
