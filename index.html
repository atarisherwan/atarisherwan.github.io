<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ATARI SHERWAN</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#05070b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
}
.page{
  width:94%;
  height:92%;
  max-width:900px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  text-align:center;
}
.brand{
  margin-top:28px;
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}
.logo{
  width:190px;
  max-width:42vw;
  height:auto;
  border-radius:20px;
  margin-top:18px;
}
.bottom{
  width:100%;
  margin-bottom:34px;
}
#start{
  width:82%;
  max-width:520px;
  padding:20px 18px;
  border:0;
  border-radius:16px;
  background:#ffd21a;
  color:#080808;
  font-size:26px;
  font-weight:900;
  cursor:pointer;
}
#start:active{
  transform:scale(.98);
}
#msg{
  min-height:24px;
  margin-top:14px;
  font-size:15px;
  color:#ff8585;
}
</style>
</head>
<body>
<div class="page">
  <div>
    <div class="brand">ATARI SHERWAN</div>
    <img class="logo" src="atari_sherwan.png" alt="ATARI SHERWAN">
  </div>

  <div class="bottom">
    <button id="start">START GOLDHEN</button>
    <div id="msg"></div>
  </div>
</div>

<script>
(function(){
  var routes = {
    '9.00':'fw9x','9.03':'fw9x','9.04':'fw9x','9.50':'fw9x','9.51':'fw9x','9.60':'fw9x',
    '10.00':'fw10x','10.01':'fw10x','10.50':'fw10x','10.70':'fw10x','10.71':'fw10x',
    '11.00':'fw11x','11.02':'fw11x','11.50':'fw11x','11.52':'fw11x',
    '12.00':'fw12x','12.02':'fw12x','12.50':'fw12x','12.52':'fw12x',
    '13.00':'fw13x','13.02':'fw13x','13.04':'fw13x','13.50':'fw13x','13.52':'fw13x'
  };

  function getFirmware(){
    var m=/PlayStation\s+4[\/\s]+(\d+)\.(\d+)/i.exec(navigator.userAgent||'');
    if(!m) return null;

    var major=String(m[1]);
    var minor=String(m[2]);

    if(minor.length===1) minor=minor+'0';
    if(minor.length>2) minor=minor.slice(0,2);

    return major+'.'+minor;
  }

  document.getElementById('start').onclick=function(){
    var msg=document.getElementById('msg');
    var fw=getFirmware();

    msg.textContent='';

    if(!fw){
      msg.textContent='PS4 NOT DETECTED';
      return;
    }

    var folder=routes[fw];
    if(!folder){
      msg.textContent='UNSUPPORTED FIRMWARE';
      return;
    }

    location.href=folder+'/jb.html';
  };
})();
</script>
</body>
</html>
