<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ATARI SHERWAN</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  background-image:url('atari_sherwan_bg.png');
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}
.overlay{
  position:fixed;
  left:0;
  right:0;
  bottom:5.5vh;
  text-align:center;
}
#start{
  width:72%;
  max-width:560px;
  min-height:72px;
  padding:18px 24px;
  border:2px solid #ffd21a;
  border-radius:18px;
  background:rgba(0,0,0,.72);
  color:#ffd21a;
  font-size:28px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 0 18px rgba(255,210,26,.55);
}
#start:active{
  transform:scale(.98);
}
#msg{
  min-height:22px;
  margin-top:12px;
  color:#fff;
  font-size:15px;
  text-shadow:0 1px 4px #000;
}
</style>
</head>
<body>
<div class="overlay">
  <button id="start">START GOLDHEN</button>
  <div id="msg"></div>
</div>

<script>
(function(){
  var routes = {
    '9.00':'fw9x','9.03':'fw9x','9.04':'fw9x','9.50':'fw9x','9.51':'fw9x','9.60':'fw9x',
    '10.00':'fw10x','10.01':'fw10x','10.50':'fw10x','10.70':'fw10x','10.71':'fw10x',
    '11.00':'fw11x','11.02':'fw11x','11.50':'fw11x','11.52':'fw11x',
    '12.00':'fw12x','12.02':'fw12x','12.50':'fw12x','12.52':'fw12x',
    '13.00':'fw13x','13.02':'fw13x','13.04':'fw13x','13.50':'fw13x','13.52':'fw13x'
  };

  function getFirmware(){
    var m=/PlayStation\s+4[\/\s]+(\d+)\.(\d+)/i.exec(navigator.userAgent||'');
    if(!m) return null;
    var major=String(m[1]);
    var minor=String(m[2]);
    if(minor.length===1) minor=minor+'0';
    if(minor.length>2) minor=minor.slice(0,2);
    return major+'.'+minor;
  }

  document.getElementById('start').onclick=function(){
    var fw=getFirmware();
    var msg=document.getElementById('msg');
    msg.textContent='';

    if(!fw){
      msg.textContent='PS4 NOT DETECTED';
      return;
    }

    var folder=routes[fw];
    if(!folder){
      msg.textContent='UNSUPPORTED FIRMWARE';
      return;
    }

    location.href=folder+'/jb.html';
  };
})();
</script>
</body>
</html>
