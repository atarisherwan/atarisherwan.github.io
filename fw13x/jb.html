<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATARI SHERWAN | GoldHEN 13.x</title>
<style>html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
#wrap{padding:18px}
#brand{color:#ffd21a;font-size:16px;font-weight:800;margin-bottom:12px}
#state{color:#ffd21a;font-size:22px;font-weight:800;margin-bottom:12px}
#console{white-space:pre-wrap;font:12px/1.45 monospace;color:#ddd;max-height:78vh;overflow:auto}
.ok{color:#7fd0a0}.bad{color:#ff7777}</style>
</head>
<body>
<div id="wrap">
  <div id="brand">ATARI SHERWAN</div>
  <div id="state">DETECTING FIRMWARE...</div>
  <pre id="console"></pre>
</div>
<script>
(function(){

  var allowed=false;
  try{
    var until=parseInt(localStorage.getItem('atari_launch_until')||'0',10);
    localStorage.removeItem('atari_launch_until');
    allowed=(until>0 && Date.now()<=until);
  }catch(e){}
  if(!allowed){
    location.replace('../');
    return;
  }


var state=document.getElementById('state'),out=document.getElementById('console');
window.lang={alreadyJailbroken:'GoldHEN is already running'};
window.jailbreakSuccess=function(msg){
  state.textContent=msg||'GOLDHEN LOADED';
  state.className='ok';
};
sessionStorage.setItem('payload_path','goldhen.bin');

function firmware(){
  var m=/PlayStation\s+4[\/\s]+(\d+)\.(\d+)/i.exec(navigator.userAgent||'');
  if(!m)return null;
  var minor=String(m[2]);
  if(minor.length===1)minor=minor+'0';
  if(minor.length>2)minor=minor.slice(0,2);
  return m[1]+'.'+minor;
}

function loadModule(src){
  var s=document.createElement('script');
  s.type='module';
  s.src=src;
  s.onerror=function(){state.textContent='FAILED TO LOAD '+src;state.className='bad';};
  document.body.appendChild(s);
}

var fw=firmware();
if(!fw){state.textContent='PS4 NOT DETECTED';state.className='bad';return;}
out.textContent='FW '+fw+'\n';

if(fw==='13.00'){
  state.textContent='LOADING GOLDHEN 13.00...';
  loadModule('slopkit/chain_poops.js');
  return;
}
if(fw==='13.02'||fw==='13.04'||fw==='13.50'||fw==='13.52'){
  state.textContent='LOADING GOLDHEN '+fw+'...';
  loadModule('relapse/jb.js');
  return;
}
state.textContent='UNSUPPORTED FW '+fw;
state.className='bad';

})();
</script>
</body>
</html>
